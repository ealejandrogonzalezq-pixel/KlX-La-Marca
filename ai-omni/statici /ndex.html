<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIX AI-Omni</title>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:15px}
h1{text-align:center;color:#00ff88;margin-top:10px}
p.sub{text-align:center;color:#aaa}
.card{background:#1a1a1a;border-radius:16px;padding:18px;margin:15px 0;border:1px solid #2a2a2a}
input,button{width:100%;padding:14px;border-radius:10px;border:none;margin-top:10px;font-size:16px;box-sizing:border-box}
button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
#r,#r2{background:#111;padding:12px;border-radius:8px;margin-top:12px;min-height:20px;white-space:pre-wrap}
small{color:#777}
</style>
</head>
<body>
<h1>🚀 KIX-La-Marca AI-Omni</h1>
<p class="sub">Investigación de vida diaria + Lector de archivos</p>

<div class="card">
<h3>💬 Pregunta de la vida diaria</h3>
<input id="q" placeholder="Ej: ¿Cómo se hace arroz con pollo?">
<button onclick="preguntar()">🔍 Investigar</button>
<div id="r">La respuesta aparecerá aquí...</div>
</div>

<div class="card">
<h3>📄 Lector por Imagen / Video / PDF</h3>
<input type="file" id="f" accept=".pdf,.jpg,.jpeg,.png,.mp4,.mp3">
<button onclick="subir()">📤 Leer Archivo</button>
<div id="r2">La info del archivo aparecerá aquí...</div>
<small>Soporta: PDF, JPG, PNG, MP4</small>
</div>

<script>
async function preguntar(){
 const q = document.getElementById('q').value;
 if(!q){alert('Escribe una pregunta'); return;}
 document.getElementById('r').innerText='⏳ Investigando...';
 let fd=new FormData(); fd.append('question', q);
 try{
  let res=await fetch('/ask',{method:'POST',body:fd});
  let data=await res.json();
  document.getElementById('r').innerText=data.respuesta;
 }catch(e){document.getElementById('r').innerText='Error: '+e}
}
async function subir(){
 const file = document.getElementById('f').files[0];
 if(!file){alert('Selecciona un archivo'); return;}
 document.getElementById('r2').innerText='⏳ Leyendo '+file.name+'...';
 let fd=new FormData(); fd.append('file', file);
 try{
  let res=await fetch('/read_file',{method:'POST',body:fd});
  let data=await res.json();
  document.getElementById('r2').innerText='✅ Archivo: '+data.archivo+'\n'+data.mensaje;
 }catch(e){document.getElementById('r2').innerText='Error: '+e}
}
</script>
</body>
</html>
